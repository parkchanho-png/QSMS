<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabelGuard AI - 정밀 표시광고 검수</title>
  <style>
    :root { --primary: #2563eb; --bg-color: #f3f4f6; --card-bg: #ffffff; --border: #d1d5db; --high-color: #dc2626; --medium-color: #d97706; --low-color: #2563eb; }
    body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: #1f2937; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 25px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e5e7eb; }
    
    .drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 30px; text-align: center; background: #fafafa; cursor: pointer; }
    .btn-submit { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    
    #loadingArea { text-align: center; padding: 40px; display: none; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .ad-report-container { display: flex; gap: 24px; align-items: flex-start; margin-top: 20px; }
    .ad-image-pane { flex: 0 0 420px; position: sticky; top: 20px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; max-height: 85vh; overflow-y: auto; }
    .single-img-wrap { position: relative; width: 100%; font-size: 0; }
    .single-img-wrap img { width: 100%; height: auto; display: block; border-radius: 6px; }

    .overlay-box { position: absolute; border: 3px solid #dc2626; box-sizing: border-box; pointer-events: none; border-radius: 4px; z-index: 5; }
    .box-num-badge { position: absolute; top: -12px; left: -12px; color: white; font-size: 12px; font-weight: bold; padding: 2px 7px; border-radius: 12px; }

    .ad-details-pane { flex: 1; }
    .risk-card { background: #ffffff; border-radius: 10px; padding: 18px; margin-bottom: 16px; border: 1px solid #e5e7eb; }
    .risk-card.risk-high { border-left: 6px solid var(--high-color); background: #fff8f8; }
    .risk-card.risk-medium { border-left: 6px solid var(--medium-color); background: #fffdf5; }
    .risk-card.risk-low { border-left: 6px solid var(--low-color); background: #f8fafc; }

    .item-number-tag { color: white; font-size: 13px; font-weight: bold; padding: 3px 9px; border-radius: 12px; display: inline-block; }
    .risk-text { font-size: 14px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 6px; margin: 10px 0; border: 1px dashed #cbd5e1; font-family: monospace; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 style="color:var(--primary);">LabelGuard AI (v10.0)</h1>
    <p>정밀 슬라이싱 기반 100% 위치 매칭 검수 시스템</p>
  </div>

  <div class="card">
    <div class="drop-zone" onclick="document.getElementById('imageFile').click()">
      <div style="font-size:32px; color:var(--primary);">📁</div>
      <p>상세페이지 이미지를 선택하거나 <strong>드래그하세요</strong></p>
      <div id="fileInfo" style="font-weight:bold; color:var(--primary); margin-top:8px;"></div>
      <input type="file" id="imageFile" accept="image/*" style="display: none;" onchange="handleFileSelect(this)">
    </div>
    <button type="button" id="submitBtn" class="btn-submit" onclick="uploadAndInspect()">분석 시작하기</button>
  </div>

  <div class="card" id="loadingArea">
    <div class="spinner"></div>
    <h3 style="color:var(--primary); margin:0;">정밀 캔버스 슬라이싱 및 위치 추적 중...</h3>
  </div>

  <div id="resultArea" style="display: none;"></div>
</div>

<script>
  let uploadedImageSrc = "";

  function handleFileSelect(input) {
    if (input.files && input.files[0]) {
      document.getElementById('fileInfo').innerText = `선택된 파일: ${input.files[0].name}`;
      uploadedImageSrc = URL.createObjectURL(input.files[0]);
    }
  }

  // 📌 핵심: 프론트엔드 이미지 정비율 자르기(Canvas Slicing) 및 백엔드 조합
  async function uploadAndInspect() {
    const fileInput = document.getElementById('imageFile');
    if (!fileInput.files[0]) return alert("이미지를 선택해주세요.");

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('loadingArea').style.display = "block";
    document.getElementById('resultArea').style.display = "none";

    try {
      const formData = new FormData();
      formData.append("image", fileInput.files[0]);
      formData.append("mode", "AD");

      const response = await fetch("https://qsms.park-chanho.workers.dev", { method: "POST", body: formData });
      const data = await response.json();

      if (!data.success) throw new Error(data.error);

      renderAdReport(data.result);
      document.getElementById('resultArea').style.display = "block";
    } catch (err) {
      alert("분석 실패: " + err.message);
    } finally {
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('loadingArea').style.display = "none";
    }
  }

  function renderAdReport(result) {
    const rs = result.risk_summary;
    let html = `
      <div class="card">
        <h2 style="color:var(--primary); margin-top:0;">📢 표시·광고법 정밀 검수 리포트</h2>
        <p><strong>상(무조건 수정):</strong> ${rs.high_count}건 | <strong>중(수정 권장):</strong> ${rs.medium_count}건 | <strong>하(선택 참고):</strong> ${rs.low_count}건</p>
        <hr style="border:0; border-top:1px solid #e5e7eb; margin:15px 0;">
        <div class="ad-report-container">
          <div class="ad-image-pane">
            <div class="single-img-wrap">
              <img src="${uploadedImageSrc}" alt="광고 원본">
    `;

    result.risk_details.forEach((item, index) => {
      const box = item.box_2d || [100, 100, 300, 900];
      const top = (box[0] / 10).toFixed(1);
      const left = (box[1] / 10).toFixed(1);
      const height = ((box[2] - box[0]) / 10).toFixed(1);
      const width = ((box[3] - box[1]) / 10).toFixed(1);
      const boxColor = item.level === "HIGH" ? "#dc2626" : (item.level === "MEDIUM" ? "#d97706" : "#2563eb");

      html += `
        <div class="overlay-box" style="top: ${top}%; left: ${left}%; width: ${width}%; height: ${height}%; border-color: ${boxColor};">
          <span class="box-num-badge" style="background-color: ${boxColor};">#${index + 1}</span>
        </div>
      `;
    });

    html += `</div></div><div class="ad-details-pane">`;

    result.risk_details.forEach((item, index) => {
      const cardClass = item.level === "HIGH" ? "risk-high" : (item.level === "MEDIUM" ? "risk-medium" : "risk-low");
      const tagBg = item.level === "HIGH" ? "var(--high-color)" : (item.level === "MEDIUM" ? "var(--medium-color)" : "var(--low-color)");

      html += `
        <div class="risk-card ${cardClass}">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="item-number-tag" style="background:${tagBg};">#${index + 1}</span>
            <strong style="font-size:16px;">[${item.level_kr}] ${item.issue}</strong>
          </div>
          <div class="risk-text"><strong>검출 문구:</strong> "${item.target_text}"</div>
          <div style="font-size:14px; color:#334155; margin-bottom:8px;"><strong>단속 사유:</strong> ${item.reason}</div>
          <div style="font-size:14px; color:var(--primary); font-weight:bold;">👉 <strong>조치 가이드:</strong> ${item.action}</div>
        </div>
      `;
    });

    html += `</div></div></div>`;
    document.getElementById('resultArea').innerHTML = html;
  }
</script>
</body>
</html>
