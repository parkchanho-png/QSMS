<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabelGuard - 한글표시사항 & 증빙서류 통합 검수</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 640px) {
      .upload-grid { grid-template-columns: 1fr; }
    }

    .upload-box {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: #fafafa;
    }

    .upload-box h3 {
      font-size: 1rem;
      margin-top: 0;
      color: #334155;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 10px;
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--primary-hover); }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      font-weight: bold;
      color: var(--primary);
    }

    .result-section { display: none; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .badge-pass { background: #dcfce7; color: #166534; }
    .badge-fail { background: #fee2e2; color: #991b1b; }
    .badge-warn { background: #fef3c7; color: #92400e; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: left;
      font-size: 0.95rem;
    }

    th { background: #f1f5f9; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🛡️ LabelGuard AI</h1>
    <p>식약처 한글표시사항 법령 검수 & 증빙서류 실시간 교차 대조</p>
  </div>

  <div class="card">
    <div class="upload-grid">
      <div class="upload-box">
        <h3>1. 라벨 / 광고 이미지 (필수)</h3>
        <input type="file" id="labelInput" accept="image/*">
      </div>
      <div class="upload-box">
        <h3>2. 증빙 서류 (선택)</h3>
        <p style="font-size: 0.8rem; color: #64748b; margin: 4px 0;">품목제조보고서, 원재료명세서, 성적서 등</p>
        <input type="file" id="docInput" accept="image/*">
      </div>
    </div>
    <button class="btn" onclick="analyzeData()">실시간 대조 및 분석 시작</button>
  </div>

  <div class="loading" id="loading">
    🔍 AI가 라벨 법령 및 증빙 서류 교차 검수를 진행 중입니다... (약 10~15초 소요)
  </div>

  <div class="card result-section" id="resultCard">
    <h2>📋 검수 결과 리포트</h2>
    <p id="summaryText" style="font-weight: bold; font-size: 1.1rem;"></p>

    <h3>1. 증빙서류 교차 대조 결과 (Cross-Check)</h3>
    <table id="crossTable">
      <thead>
        <tr>
          <th>검수 항목</th>
          <th>상태</th>
          <th>라벨 표기</th>
          <th>증빙서류 내용</th>
          <th>비고/지침</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3 style="margin-top: 24px;">2. 식약처 부당 표시·광고 위반 검출</h3>
    <table id="violationTable">
      <thead>
        <tr>
          <th>위반 문구</th>
          <th>위반 사유</th>
          <th>관련 법령</th>
          <th>수정 권장안</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  async function analyzeData() {
    const labelFile = document.getElementById("labelInput").files[0];
    const docFile = document.getElementById("docInput").files[0];

    if (!labelFile) {
      alert("라벨/광고 이미지를 등록해 주세요.");
      return;
    }

    const formData = new FormData();
    formData.append("image", labelFile);
    if (docFile) formData.append("doc", docFile);

    document.getElementById("loading").style.display = "block";
    document.getElementById("resultCard").style.display = "none";

    try {
      const response = await fetch("https://qsms.park-chanho.workers.dev", {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      document.getElementById("loading").style.display = "none";

      if (!data.success) {
        alert("분석 실패: " + data.error);
        return;
      }

      renderResult(data.result);
    } catch (err) {
      document.getElementById("loading").style.display = "none";
      alert("통신 오류 발생: " + err.message);
    }
  }

  function renderResult(resultData) {
    let res = typeof resultData === "string" ? JSON.parse(resultData) : resultData;
    document.getElementById("resultCard").style.display = "block";
    document.getElementById("summaryText").innerText = res.summary || "분석이 완료되었습니다.";

    // 교차 검수 테이블 Rendering
    const crossTbody = document.querySelector("#crossTable tbody");
    crossTbody.innerHTML = "";
    if (res.cross_check && res.cross_check.length > 0) {
      res.cross_check.forEach(item => {
        const tr = document.createElement("tr");
        const statusBadge = item.status === "match" 
          ? '<span class="badge badge-pass">일치</span>' 
          : '<span class="badge badge-fail">불일치</span>';
        tr.innerHTML = `
          <td>${item.item}</td>
          <td>${statusBadge}</td>
          <td>${item.label_value || '-'}</td>
          <td>${item.doc_value || '-'}</td>
          <td>${item.note || '-'}</td>
        `;
        crossTbody.appendChild(tr);
      });
    } else {
      crossTbody.innerHTML = "<tr><td colspan='5'>제출된 증빙 서류가 없거나 대조 항목이 없습니다.</td></tr>";
    }

    // 법령 위반 테이블 Rendering
    const violTbody = document.querySelector("#violationTable tbody");
    violTbody.innerHTML = "";
    if (res.violations && res.violations.length > 0) {
      res.violations.forEach(v => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="color:red; font-weight:bold;">${v.word}</td>
          <td>${v.issue}</td>
          <td>${v.law}</td>
          <td style="color:blue;">${v.guide}</td>
        `;
        violTbody.appendChild(tr);
      });
    } else {
      violTbody.innerHTML = "<tr><td colspan='4'>위반 사항이 검출되지 않았습니다.</td></tr>";
    }
  }
</script>

</body>
</html>
