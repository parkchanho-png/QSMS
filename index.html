
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabelGuard AI - 통합 정밀 검수 시스템</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #2563eb; --primary-hover: #1d4ed8; --bg-color: #f3f4f6; --card-bg: #ffffff;
      --border: #d1d5db; --text-main: #1f2937; --text-muted: #6b7280;
      --high-color: #dc2626; --medium-color: #d97706; --low-color: #2563eb;
    }
    body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { margin: 0; color: var(--primary); font-size: 28px; }
    .header p { color: var(--text-muted); margin-top: 5px; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e5e7eb; }

    .mode-selector { display: flex; gap: 10px; margin-bottom: 20px; }
    .mode-btn { flex: 1; padding: 15px; border: 2px solid var(--border); background: #f9fafb; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: var(--text-muted); transition: all 0.2s; user-select: none; }
    .mode-btn.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    .mode-btn:hover { background: #f3f4f6; }

    .form-group { margin-bottom: 20px; display: block; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; }
    .drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 30px; text-align: center; background: #fafafa; cursor: pointer; transition: all 0.2s; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); background-color: #eff6ff; }
    .drop-zone * { pointer-events: none; }
    .drop-zone-icon { font-size: 36px; margin-bottom: 8px; color: var(--primary); }
    .file-info { margin-top: 10px; font-weight: bold; color: var(--primary); font-size: 14px; word-break: break-all; }

    .deep-option { display: flex; align-items: flex-start; gap: 8px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 14px; }
    .deep-option input { margin-top: 4px; }
    .deep-option small { color: var(--text-muted); display: block; }

    .btn-submit { display: block; width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { background: #9ca3af; cursor: not-allowed; }

    #loadingArea { text-align: center; padding: 40px; display: none; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 25px; font-size: 14px; }
    th, td { border: 1px solid #e5e7eb; padding: 12px; text-align: left; }
    th { background-color: #f9fafb; font-weight: bold; }
    .status-pass { color: #059669; font-weight: bold; }
    .status-fail { color: #dc2626; font-weight: bold; }

    .summary-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .badge { padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
    .badge.high { background: #fee2e2; color: var(--high-color); border: 1px solid #fca5a5; }
    .badge.medium { background: #fef3c7; color: var(--medium-color); border: 1px solid #fcd34d; }
    .badge.low { background: #eff6ff; color: var(--low-color); border: 1px solid #bfdbfe; }

    .meta-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #475569; margin-bottom: 15px; }
    .meta-box .note { color: #b45309; font-weight: bold; margin-top: 4px; }
    .warn-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; font-size: 14px; }

    .ad-report-container { display: flex; gap: 24px; align-items: flex-start; margin-top: 20px; }
    .ad-image-pane { flex: 0 0 450px; position: sticky; top: 20px; background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 10px; max-height: 80vh; overflow-y: auto; }
    .single-img-wrap { position: relative; width: 100%; font-size: 0; }
    .single-img-wrap img { width: 100%; height: auto; display: block; border-radius: 6px; }
    .pin { position: absolute; left: 0; right: 0; height: 0; border-top: 3px solid #facc15; pointer-events: none; display: none; }
    .pin.show { display: block; }

    .ad-details-pane { flex: 1; min-width: 0; }
    .risk-card { background: #ffffff; border-radius: 10px; padding: 18px; margin-bottom: 16px; border: 1px solid #e5e7eb; }
    .risk-card.active-focus { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35); }
    .risk-card.risk-high { border-left: 6px solid var(--high-color); }
    .risk-card.risk-medium { border-left: 6px solid var(--medium-color); }
    .risk-card.risk-low { border-left: 6px solid var(--low-color); }
    .item-number-tag { color: white; font-size: 13px; font-weight: bold; padding: 3px 9px; border-radius: 12px; display: inline-block; }

    .phrase-row { background: rgba(241,245,249,0.8); border: 1px dashed #cbd5e1; border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 14px; }
    .phrase-text { font-family: monospace; word-break: break-all; }
    .chip { display: inline-block; margin: 4px 4px 0 0; padding: 2px 9px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; cursor: pointer; }
    .chip:hover { background: #c7d2fe; }
    .count-tag { font-size: 12px; color: var(--text-muted); font-weight: bold; margin-left: 6px; }

    @media (max-width: 860px) { .ad-report-container { flex-direction: column; } .ad-image-pane { position: static; flex: none; width: 100%; box-sizing: border-box; } }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>LabelGuard AI (v20)</h1>
    <p>규칙 엔진 우선 + 필요할 때만 AI를 호출하는 하이브리드 검수 시스템</p>
  </div>

  <div class="card">
    <div class="mode-selector">
      <button type="button" id="btnModeLabel" class="mode-btn active">🏷️ 한글표시사항 검수</button>
      <button type="button" id="btnModeAd" class="mode-btn">📢 상세페이지/광고 검수</button>
    </div>

    <div class="form-group" id="mainUploadGroup">
      <label id="mainImageLabel">1. 검수할 한글표시사항 라벨 첨부 (필수)</label>
      <div class="drop-zone" id="mainDropZone">
        <div class="drop-zone-icon" id="mainDropZoneIcon">📁</div>
        <p id="mainDropZoneText">이미지를 클릭하거나 <strong>이곳으로 드래그하세요</strong></p>
        <div class="file-info" id="mainFileInfo"></div>
        <input type="file" id="imageFile" accept="image/*" style="display: none;">
      </div>
    </div>

    <div class="form-group" id="docUploadGroup">
      <label>2. 증빙서류 이미지 첨부 (선택: 사업자등록증 등)</label>
      <div class="drop-zone" id="docDropZone">
        <div class="drop-zone-icon">📄</div>
        <p>서류를 클릭하거나 <strong>이곳으로 드래그하세요</strong></p>
        <div class="file-info" id="docFileInfo"></div>
        <input type="file" id="docFile" accept="image/*" style="display: none;">
      </div>
    </div>

    <label class="deep-option">
      <input type="checkbox" id="deepMode">
      <span><strong>정밀 모드 (AI에 원본 이미지 첨부)</strong>
        <small>OCR 신뢰도가 낮은 문구까지 AI가 이미지를 보고 재판독합니다. 토큰이 더 소모되므로 결과가 이상할 때만 켜세요.</small>
      </span>
    </label>

    <button type="button" id="submitBtn" class="btn-submit">분석 시작하기</button>
  </div>

  <div class="card" id="loadingArea">
    <div class="spinner"></div>
    <h3 style="margin:0; color:var(--primary);" id="loadingText">검수 진행 중...</h3>
    <p style="color:var(--text-muted); font-size:14px; font-weight:bold;" id="loadingSubText">잠시만 기다려 주세요.</p>
  </div>

  <div id="resultArea" style="display: none;"></div>
</div>

<script>
  // ===================== 설정 =====================
  const API_URL = "https://qsms.park-chanho.workers.dev";
  const MAX_FILE_MB = 15;
  const SLICE_H = 1600;      // OCR 분할 높이(px)
  const SLICE_OVERLAP = 80;  // 분할 겹침(px)
  const MIN_W = 1500, MAX_W = 2200;
  const MIN_LINE_CONF = 30;  // 이보다 낮은 줄은 쓰레기로 보고 버림
  const UPLOAD_MAX_W = 1400, UPLOAD_MAX_H = 16000;

  // ===================== 상태 =====================
  let currentMode = "LABEL";
  let uploadedImageSrc = "";
  let riskDetailsData = [];
  let selectedMainFile = null;
  let selectedDocFile = null;

  let ocrWorkerPromise = null;
  let progressHandler = null;

  window.addEventListener('dragover', (e) => e.preventDefault(), false);
  window.addEventListener('drop', (e) => e.preventDefault(), false);

  // ===================== 공통 유틸 =====================
  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const squash = (s) => (s || "").toLowerCase().replace(/[\s\u00a0]+/g, "").replace(/[·•・,.\-_~'"“”‘’()\[\]{}:;!?]/g, "");
  function setLoading(title, sub) {
    if (title) document.getElementById('loadingText').innerText = title;
    if (sub) document.getElementById('loadingSubText').innerText = sub;
  }

  // ===================== 모드 전환 =====================
  function setMode(mode) {
    currentMode = mode;
    document.getElementById("btnModeLabel").className = mode === "LABEL" ? "mode-btn active" : "mode-btn";
    document.getElementById("btnModeAd").className = mode === "AD" ? "mode-btn active" : "mode-btn";
    const isAd = mode === "AD";
    document.getElementById("docUploadGroup").style.display = isAd ? "none" : "block";
    document.getElementById("mainImageLabel").innerText = isAd
      ? "1. 검수할 상세페이지 / 광고 이미지 첨부 (필수)"
      : "1. 검수할 한글표시사항 라벨 첨부 (필수)";
    document.getElementById("mainDropZoneText").innerHTML = isAd
      ? "상세페이지 이미지를 클릭하거나 <strong>이곳으로 드래그하세요</strong>"
      : "라벨 이미지를 클릭하거나 <strong>이곳으로 드래그하세요</strong>";
    document.getElementById("mainDropZoneIcon").innerText = isAd ? "📢" : "📁";
    document.getElementById("resultArea").style.display = "none";
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btnModeLabel').addEventListener('click', () => setMode('LABEL'));
    document.getElementById('btnModeAd').addEventListener('click', () => setMode('AD'));
    document.getElementById('submitBtn').addEventListener('click', uploadAndInspect);
    setupDropZone('mainDropZone', 'imageFile', 'mainFileInfo', 'MAIN');
    setupDropZone('docDropZone', 'docFile', 'docFileInfo', 'DOC');
  });

  function setupDropZone(dropZoneId, inputId, infoId, fileType) {
    const dropZone = document.getElementById(dropZoneId);
    const input = document.getElementById(inputId);
    if (!dropZone || !input) return;

    dropZone.addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
      if (input.files && input.files[0]) saveSelectedFile(input.files[0], infoId, fileType);
    });
    ['dragenter', 'dragover'].forEach((ev) => dropZone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation(); dropZone.classList.add('dragover');
    }, false));
    ['dragleave', 'drop'].forEach((ev) => dropZone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('dragover');
    }, false));
    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      if (dt && dt.files && dt.files.length > 0) saveSelectedFile(dt.files[0], infoId, fileType);
    }, false);
  }

  function saveSelectedFile(file, infoId, fileType) {
    if (!file || !file.type.startsWith('image/')) return alert('이미지 파일만 첨부할 수 있습니다.');
    if (file.size > MAX_FILE_MB * 1024 * 1024) return alert(`파일이 너무 큽니다. (최대 ${MAX_FILE_MB}MB)`);

    if (fileType === 'MAIN') {
      if (uploadedImageSrc) URL.revokeObjectURL(uploadedImageSrc);
      selectedMainFile = file;
      uploadedImageSrc = URL.createObjectURL(file);
    } else {
      selectedDocFile = file;
    }
    document.getElementById(infoId).innerText = `선택된 파일: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
  }

  // ===================== OCR (전처리 + 분할 + 워커 재사용) =====================
  function getOcrWorker() {
    if (!ocrWorkerPromise) {
      if (typeof Tesseract === 'undefined') return Promise.reject(new Error("Tesseract 라이브러리를 불러오지 못했습니다."));
      // 한글 + 영문/숫자를 함께 인식
      ocrWorkerPromise = Tesseract.createWorker('kor+eng', 1, {
        logger: (m) => { if (progressHandler) progressHandler(m); }
      }).catch((e) => { ocrWorkerPromise = null; throw e; });
    }
    return ocrWorkerPromise;
  }

  // 흑백 + 대비 보정
  function enhance(ctx, w, h) {
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      let v = (gray - 128) * 1.35 + 128;
      v = v < 0 ? 0 : (v > 255 ? 255 : v);
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(img, 0, 0);
  }

  async function makeUploadBlob(bmp) {
    let s = Math.min(1, UPLOAD_MAX_W / bmp.width);
    if (bmp.height * s > UPLOAD_MAX_H) s = UPLOAD_MAX_H / bmp.height;
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * s));
    c.height = Math.max(1, Math.round(bmp.height * s));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((res) => c.toBlob(res, 'image/jpeg', 0.85));
  }

  async function runClientOCR(file, mode) {
    const bmp = await createImageBitmap(file);
    const scale = bmp.width < MIN_W ? MIN_W / bmp.width : (bmp.width > MAX_W ? MAX_W / bmp.width : 1);
    const W = Math.round(bmp.width * scale);
    const H = Math.round(bmp.height * scale);

    const worker = await getOcrWorker();
    // 라벨(빽빽한 표)은 단일 블록(6), 상세페이지는 자동 레이아웃(3)
    await worker.setParameters({
      tessedit_pageseg_mode: mode === 'LABEL' ? '6' : '3',
      preserve_interword_spaces: '1'
    });

    const slices = [];
    for (let top = 0; top < H; top += (SLICE_H - SLICE_OVERLAP)) {
      const sh = Math.min(SLICE_H, H - top);
      slices.push({ top, sh });
      if (top + sh >= H) break;
    }

    const lines = [];
    for (let i = 0; i < slices.length; i++) {
      const { top, sh } = slices[i];
      progressHandler = (m) => {
        if (m.status === 'recognizing text') {
          setLoading(null, `1단계: 텍스트 스캔 중 (${i + 1}/${slices.length} 구간) ${Math.round(m.progress * 100)}%`);
        } else {
          setLoading(null, `OCR 엔진 준비 중 (${m.status})...`);
        }
      };

      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = sh;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(bmp, 0, top / scale, bmp.width, sh / scale, 0, 0, W, sh);
      enhance(ctx, W, sh);

      const ret = await worker.recognize(canvas);
      const found = (ret.data && ret.data.lines) ? ret.data.lines : [];
      found.forEach((line) => {
        const text = line.text.replace(/\s+/g, " ").trim();
        const conf = Math.round(line.confidence || 0);
        if (text.length < 2 || conf < MIN_LINE_CONF) return;
        const yAbs = top + (line.bbox.y0 + line.bbox.y1) / 2;
        const y = Math.min(99, Math.max(1, Math.round((yAbs / H) * 100)));
        const key = squash(text);
        // 구간 겹침으로 생기는 중복 제거
        if (lines.some((l) => squash(l.text) === key && Math.abs(l.y_percent - y) <= 2)) return;
        lines.push({ text, y_percent: y, conf });
      });
      canvas.width = canvas.height = 0;
    }
    progressHandler = null;

    const uploadBlob = await makeUploadBlob(bmp);
    bmp.close && bmp.close();
    return { lines, uploadBlob };
  }

  // ===================== 검수 실행 =====================
  async function uploadAndInspect() {
    if (!selectedMainFile) return alert("검수할 이미지를 첨부해주세요.");
    const deep = document.getElementById('deepMode').checked;

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('resultArea').style.display = "none";
    document.getElementById('loadingArea').style.display = "block";

    let stage = "OCR";
    try {
      setLoading("1/2단계: 이미지 전처리 및 OCR 스캔 중...", "첫 실행 시 한글 OCR 데이터를 내려받느라 시간이 더 걸릴 수 있습니다.");
      let ocr = { lines: [], uploadBlob: null };
      try {
        ocr = await runClientOCR(selectedMainFile, currentMode);
      } catch (e) {
        if (!deep) throw new Error("OCR 실패: " + e.message + "\n'정밀 모드'를 켜면 OCR 없이 AI가 직접 판독합니다.");
      }

      stage = "SERVER";
      setLoading("2/2단계: 규칙 검수 + 필요한 항목만 AI 확인 중...", "규칙으로 판정 가능한 항목은 AI를 호출하지 않습니다.");

      const formData = new FormData();
      formData.append("mode", currentMode);
      formData.append("deep", deep ? "1" : "0");
      formData.append("tesseract_ocr", JSON.stringify(ocr.lines));
      // 이미지는 AI에 실제로 필요할 수 있는 경우(라벨/정밀 모드)에만 전송
      if (ocr.uploadBlob && (currentMode === "LABEL" || deep)) formData.append("image", ocr.uploadBlob, "image.jpg");
      if (currentMode === "LABEL" && selectedDocFile) formData.append("doc", selectedDocFile);

      const response = await fetch(API_URL, { method: "POST", body: formData });
      let data;
      try { data = await response.json(); } catch (e) { throw new Error("서버 응답을 해석하지 못했습니다. (HTTP " + response.status + ")"); }
      if (!data.success) throw new Error(data.error || "알 수 없는 서버 오류");

      if (data.result.inspect_mode === "AD") renderAdReport(data.result);
      else renderLabelReport(data.result);
      document.getElementById('resultArea').style.display = "block";
    } catch (err) {
      alert((stage === "OCR" ? "[OCR 단계] " : "[서버 단계] ") + err.message);
    } finally {
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('loadingArea').style.display = "none";
    }
  }

  // ===================== 공통: 메타 박스 =====================
  function renderMeta(meta) {
    if (!meta) return "";
    const parts = [];
    if (meta.cache_hit) parts.push("💾 캐시된 결과 (AI 호출 없음)");
    else parts.push(meta.ai_used ? `🤖 AI ${meta.ai_calls}회 호출` : "🆓 AI 호출 없음 (규칙 판정만 사용)");
    if (typeof meta.line_count === "number") parts.push(`OCR ${meta.line_count}줄 · 평균 신뢰도 ${meta.avg_conf}%`);
    if (meta.ai_lines) parts.push(`AI 교정 대상 ${meta.ai_lines}줄`);
    let html = `<div class="meta-box">${esc(parts.join("  |  "))}`;
    (meta.notes || []).forEach((n) => { html += `<div class="note">⚠️ ${esc(n)}</div>`; });
    return html + `</div>`;
  }

  // ===================== 광고 리포트 (문구 그룹핑) =====================
  function renderAdReport(result) {
    const rs = result.risk_summary;
    riskDetailsData = result.risk_details || [];

    let html = `
      <div class="card">
        <h2 style="color:var(--primary); margin-top:0;">📢 표시·광고법 정밀 검수 리포트</h2>
        <div style="background:#eff6ff; padding:10px; border-radius:6px; font-weight:bold; color:var(--primary); margin-bottom:15px; font-size:14px;">
          ⚖️ ${esc(result.law_status || '식약처 고시 기준 적용')}
        </div>
        ${renderMeta(result.meta)}
        <div class="summary-box">
          <span class="badge high">상(무조건 수정): ${rs.high_count}건</span>
          <span class="badge medium">중(수정 권장): ${rs.medium_count}건</span>
          <span class="badge low">하(선택 참고): ${rs.low_count}건</span>
          <span class="badge" style="background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;">총 ${rs.total_occurrences}곳에서 검출</span>
        </div>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">👉 위치 버튼(예: 12%)을 누르면 왼쪽 원본 이미지가 해당 위치로 이동합니다. 같은 문구는 한 번만 표시되고 위치만 모아서 보여줍니다.</p>
        <hr style="border:0; border-top:1px solid #e5e7eb; margin:15px 0;">
        <div class="ad-report-container">
          <div class="ad-image-pane" id="adImagePane">
            <div class="single-img-wrap" id="singleImgWrap">
              <img src="${esc(uploadedImageSrc)}" id="targetAdImage" alt="광고 원본">
              <div class="pin" id="pinLine"></div>
            </div>
          </div>
          <div class="ad-details-pane">
    `;

    if (riskDetailsData.length === 0) {
      html += `<p style="text-align:center; padding: 20px; font-weight:bold; color:#059669;">🎉 규칙에 해당하는 문구가 발견되지 않았습니다.</p>`;
    } else {
      riskDetailsData.forEach((item, index) => {
        const cls = item.level === "HIGH" ? "risk-high" : (item.level === "MEDIUM" ? "risk-medium" : "risk-low");
        const color = item.level === "HIGH" ? "var(--high-color)" : (item.level === "MEDIUM" ? "var(--medium-color)" : "var(--low-color)");
        html += `
          <div class="risk-card ${cls}" id="riskCard_${index}">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;">
              <span class="item-number-tag" style="background:${color};">#${index + 1}</span>
              <strong style="font-size:16px; color:${color}">[${esc(item.level_kr)}] ${esc(item.issue)}</strong>
              <span class="count-tag">총 ${item.occurrence_count}곳</span>
            </div>
            <div style="font-size:14px; color:#334155; margin-bottom:8px;"><strong>단속 사유:</strong> ${esc(item.reason)}</div>
        `;
        item.phrases.forEach((p) => {
          html += `<div class="phrase-row"><span class="phrase-text">"${esc(p.text)}"</span>${p.count > 1 ? `<span class="count-tag">${p.count}회 반복</span>` : ""}<div>`;
          p.positions.forEach((pos) => {
            html += `<span class="chip" data-card="${index}" data-y="${pos}">📍 ${pos}%</span>`;
          });
          html += `</div></div>`;
        });
        html += `
            <div style="font-size:14px; color:var(--primary); font-weight:bold; margin-top:8px;">👉 <strong>조치 가이드:</strong> ${esc(item.action)}</div>
          </div>
        `;
      });
    }

    html += `</div></div></div>`;
    const area = document.getElementById("resultArea");
    area.innerHTML = html;

    area.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => focusImageSection(Number(chip.dataset.card), Number(chip.dataset.y)));
    });

    const img = document.getElementById('targetAdImage');
    if (img && riskDetailsData.length > 0) {
      const first = riskDetailsData[0].phrases[0].positions[0];
      const go = () => focusImageSection(0, first);
      if (img.complete) go(); else img.onload = go;
    }
  }

  function focusImageSection(cardIndex, yPercent) {
    const pane = document.getElementById('adImagePane');
    const img = document.getElementById('targetAdImage');
    const pin = document.getElementById('pinLine');
    if (!img || !pane) return;

    document.querySelectorAll('.risk-card').forEach((c) => c.classList.remove('active-focus'));
    const card = document.getElementById(`riskCard_${cardIndex}`);
    if (card) card.classList.add('active-focus');

    const h = img.getBoundingClientRect().height;
    if (h > 0) {
      if (pin) { pin.style.top = `${yPercent}%`; pin.classList.add('show'); }
      const target = h * (yPercent / 100) - pane.clientHeight / 2;
      pane.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
    }
  }

  // ===================== 라벨 리포트 =====================
  function matchText(v) {
    if (v === true) return `<span class="status-pass">일치</span>`;
    if (v === false) return `<span class="status-fail">불일치 (확인 필요)</span>`;
    return `<span style="color:var(--text-muted);">비교 불가</span>`;
  }

  function renderLabelReport(result) {
    let html = `
      <div class="card">
        <h2 style="color:var(--primary); margin-top:0;">🏷️ 한글표시사항 정밀 검수 리포트</h2>
        <div style="background:#eff6ff; padding:10px; border-radius:6px; font-weight:bold; color:var(--primary); margin-bottom:15px; font-size:14px;">
          ⚖️ ${esc(result.law_status || '식약처 고시 기준 적용')}
        </div>
        ${renderMeta(result.meta)}
        <p><strong>총평:</strong> ${esc(result.summary)}</p>
        <p><strong>제품명:</strong> ${esc(result.analyzed_summary.product_name)} | <strong>식품유형:</strong> ${esc(result.analyzed_summary.food_type)}</p>
        <h3 style="margin-top:25px;">✅ 1. 법정 필수 표시항목 (확인됨)</h3>
        <table><thead><tr><th width="25%">필수 항목명</th><th width="12%">상태</th><th>식별된 내용</th></tr></thead><tbody>
    `;
    if (!result.passed_items || result.passed_items.length === 0) {
      html += `<tr><td colspan="3" style="text-align:center;">확인된 항목 없음</td></tr>`;
    } else {
      result.passed_items.forEach((i) => { html += `<tr><td>${esc(i.name)}</td><td class="status-pass">확인</td><td>${esc(i.detail)}</td></tr>`; });
    }
    html += `</tbody></table><h3>🚨 2. 필수항목 누락 / 미확인</h3><table><thead><tr><th width="20%">항목명</th><th width="30%">사유</th><th>조치 가이드</th></tr></thead><tbody>`;
    if (!result.failed_items || result.failed_items.length === 0) {
      html += `<tr><td colspan="3" style="text-align:center; color:#059669; font-weight:bold;">누락 항목이 없습니다.</td></tr>`;
    } else {
      result.failed_items.forEach((i) => { html += `<tr><td class="status-fail">${esc(i.item_name)}</td><td>${esc(i.issue_reason)}</td><td>${esc(i.how_to_improve)}</td></tr>`; });
    }
    html += `</tbody></table>`;

    if (result.warnings && result.warnings.length > 0) {
      html += `<h3>⚠️ 3. 내용 점검 경고</h3>`;
      result.warnings.forEach((w) => { html += `<div class="warn-box"><strong>${esc(w.item)}</strong> — ${esc(w.message)}</div>`; });
    }

    if (result.doc_check) {
      const d = result.doc_check;
      html += `
        <h3>📄 증빙서류 대조</h3>
        <table><thead><tr><th width="20%">구분</th><th>서류에서 읽은 값</th><th width="20%">라벨과 비교</th></tr></thead><tbody>
          <tr><td>상호</td><td>${esc(d.doc_business_name || "-")}</td><td>${matchText(d.business_match)}</td></tr>
          <tr><td>소재지</td><td>${esc(d.doc_address || "-")}</td><td>${matchText(d.address_match)}</td></tr>
        </tbody></table>`;
    }

    html += `</div>`;
    document.getElementById("resultArea").innerHTML = html;
  }
</script>
</body>
</html>
